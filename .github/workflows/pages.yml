# Kold Lite on GitHub Pages: a fresh scan of official job sources every day, plus the app itself.
# Site layout:  /kold/        landing page (docs/)
#               /kold/app/    the Kold Lite PWA (web/, static export)
#               /kold/data/   today's job feed (jobs.json, contacts.json, meta.json)
name: Daily feed and Pages

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST, once a day
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Scan official job sources
        working-directory: api
        run: |
          pip install -r requirements.txt
          python -m scripts.export_feed --out ../site/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Kold Lite
        working-directory: web
        env:
          KOLD_STATIC: "1"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          cp -r docs/. site/
          cp -r web/out site/app
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
